{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="hero-wrap ftco-degree-bg" style="background-image: url({% static '/images/bg_1.jpg' %});" data-stellar-background-ratio="0.5">
      <div class="overlay"></div>
      <div class="container">
        <div class="row no-gutters slider-text justify-content-start align-items-center justify-content-center">
          <div class="col-lg-8 ftco-animate">
              <form action="#" class="request-form ftco-animate bg-info" method="post" enctype="multipart/form-data">
                  {% csrf_token %}
                  <h2>Login</h2>
                  <div class="form-group">
                      <label for="" class="label">Username</label>
                      <input type="text" name="username" class="form-control" placeholder="Username">
                  </div>
                  <div class="form-group">
                      <label for="" class="label">Password</label>
                      <input type="password" name="pass1" class="form-control" placeholder="password">
                  </div>
                  <button class="btn btn-success" type="submit">Submit</button>
                  <p>If not register than please <a href="/cusregistration/" style="color:#fff;text-decoration:underline;">Registration</a></p>
              </form>
          </div>
        </div>
      </div>
</div>
<br>
{% endblock %}
