{% extends 'cusbase.html' %}
{% load static %}
{% block content %}
 <div class="hero-wrap ftco-degree-bg" style="background-image: url({% static '/images/bg_1.jpg' %});" data-stellar-background-ratio="0.5">
      <div class="overlay"></div>
      <div class="container"><br><br><br><br>
        <div class="row no-gutters slider-text justify-content-start align-items-center justify-content-center">
			  <div class="col-md-12	featured-top">
    				<div class="row no-gutters justify-content-center">
	  					<div class="col-md-4 d-flex align-items-center">
	  						<form action="#" class="request-form ftco-animate bg-primary" method="post">
								{% csrf_token %}
		          		<h2>Make your trip</h2>
			    				<div class="form-group">
			    					<label for="" class="label">Pick-up location</label>
			    					<input type="text" name="plocation" class="form-control" placeholder="City, Airport, Station, etc">
			    				</div>
			    				<div class="form-group">
			    					<label for="" class="label">Drop-off location</label>
			    					<input type="text" name="dlocation" class="form-control" placeholder="City, Airport, Station, etc">
			    				</div>
			    				<div class="d-flex">
			    					<div class="form-group mr-2">
			                <label for="" class="label">Pick-up date</label>
			                <input type="date" name="pdate" class="form-control"  placeholder="Date">
			              </div>
			              <div class="form-group ml-2">
			                <label for="" class="label">Drop-off date</label>
			                <input type="date" name="ddate" class="form-control"  placeholder="Date">
			              </div>
		              </div>
		              <div class="form-group">
		                <label for="" class="label">Pick-up time</label>
		                <input type="time" name="time" class="form-control"  placeholder="Time">
		              </div>
			            <div class="form-group">
			              <input type="submit" value="Rent A Car Now" class="btn btn-secondary py-3 px-4">
			            </div>
			    			</form>
	  					</div>
	  				</div>
			  </div>
          </div>
        </div>
      </div>
<!--    </div>-->

	{% endblock %}
